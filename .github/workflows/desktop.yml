name: Desktop app

# Builds the Windows version of the app (a single portable .exe) and publishes it as a GitHub Release
# tagged desktop-v0.1.<run number>. Only runs when files under desktop/ change.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Smoke test YouTube Music calls
        run: node smoke-test.mjs
        continue-on-error: true
      - name: Download yt-dlp
        run: |
          mkdir -p bin
          curl -fsSL -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          ./bin/yt-dlp.exe --version
      - name: Check yt-dlp works with Electron as its JS engine and no Node on PATH
        run: |
          export ELECTRON_RUN_AS_NODE=1
          exe="$(pwd)/node_modules/electron/dist/electron.exe"
          noNodePath="$(echo "$PATH" | tr ':' '\n' | grep -vi nodejs | paste -sd:)"
          mkdir -p dl
          PATH="$noNodePath" ./bin/yt-dlp.exe -f "bestaudio[ext=m4a]/bestaudio/best" --no-warnings --no-progress --no-part -o "dl/dQw4w9WgXcQ.%(ext)s" --js-runtimes "node:$exe" "https://music.youtube.com/watch?v=dQw4w9WgXcQ"
          ls -l dl
        continue-on-error: true
      - name: Set version
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - name: Build portable exe
        run: npx electron-builder --win portable --publish never
      - name: Package small code-only update
        run: |
          v="0.1.${{ github.run_number }}"
          mkdir stage
          cp app-main.js parse.js preload.js package.json stage/
          cp -r renderer assets stage/
          (cd stage && npm install --omit=dev --no-audit --no-fund && node -e "import('youtubei.js').then(()=>console.log('stage import ok'))" && echo "$v" > version.txt)
          powershell -NoProfile -Command "Compress-Archive -Path stage/* -DestinationPath code-$v.zip"
          ls -l code-$v.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="desktop-v0.1.${{ github.run_number }}"
          gh release create "$tag" dist/ArchiveTune-Desktop-*.exe "code-0.1.${{ github.run_number }}.zip" \
            --title "ArchiveTune Desktop 0.1.${{ github.run_number }}" \
            --notes "Windows portable build. Run the .exe; no install needed." --prerelease
