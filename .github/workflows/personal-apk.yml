name: Personal APK

# Builds a single phone-ready APK that needs no secrets or signing keys.
# It uses the debug variant, so it installs NEXT TO the original ArchiveTune
# (package moe.rukamori.archivetune.debug) and does not touch its data.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK (arm64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py
        continue-on-error: true

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleGmsMobileArm64Debug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-personal-arm64-debug
          path: out/*.apk
          if-no-files-found: error
