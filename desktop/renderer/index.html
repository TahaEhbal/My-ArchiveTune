  <div id="app">
    <aside id="side">
      <nav class="card" id="mainnav">
        <button data-view="home" class="nav"><svg class="i"><use href="#i-home"/></svg>Home</button>
        <button data-view="explore" class="nav"><svg class="i"><use href="#i-explore"/></svg>Explore</button>
        <button data-view="charts" class="nav"><svg class="i"><use href="#i-chart"/></svg>Charts</button>
      </nav>
      <section class="card" id="libcard">
        <div class="libhead"><span>Your library</span><button id="libcreate" class="ib" title="Create playlist"><svg class="i"><use href="#i-plus"/></svg></button></div>
        <label class="libsearch"><svg class="i"><use href="#i-search"/></svg><input id="libfilter" placeholder="Search in your library" /></label>
        <div class="libquick">
          <button data-view="liked" class="nav"><span class="tile t-like"><svg class="i"><use href="#i-heart"/></svg></span><span class="nt">Liked songs</span></button>
          <button data-view="downloads" class="nav"><span class="tile" id="tile-dl"><svg class="i"><use href="#i-download"/></svg></span><span class="nt">Downloads</span></button>
          <button data-view="queue" class="nav"><span class="tile" id="tile-q"><svg class="i"><use href="#i-queue"/></svg></span><span class="nt">Queue</span></button>
        </div>
        <div class="libsep"></div>
        <div id="sidelib"></div>
              </section>
    </aside>

    <main id="main" class="card">
      <div id="hero"></div>
      <div id="topbar">
        <div class="navbtns"><button id="back" hidden title="Back"><svg class="i"><use href="#i-left"/></svg></button></div>
        <label id="searchbox"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="What do you want to play?" /></label>
        <div id="account"></div>
      </div>
      <div id="scroll">
        <div class="pagehead"><h2 id="title">Home</h2><span id="status"></span></div>
        <div id="list"></div>
      </div>
    </main>

    <footer id="player">
      <div id="np">
        <img id="art" alt="" />
        <div id="meta"><div id="np-title">Nothing playing</div><div id="np-artist"></div></div>
        <button id="like" class="ib" title="Like (syncs to your YouTube account)"><svg class="i"><use href="#i-heart"/></svg></button>
      </div>
      <div id="center">
        <div id="controls">
          <button id="prev" class="ib" title="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
          <button id="play" title="Play / pause"><svg class="i"><use href="#i-play"/></svg></button>
          <button id="next" class="ib" title="Next"><svg class="i"><use href="#i-next"/></svg></button>
          <button id="repeat" class="ib on" title="Repeat: loop the queue"><svg class="i"><use href="#i-repeat"/></svg><span id="rep1"></span></button>
        </div>
        <div id="seek"><span id="cur">0:00</span><input id="bar" type="range" min="0" max="1000" value="0" /><span id="dur">0:00</span></div>
      </div>
      <div id="right">
        <button id="expand" class="ib" title="Full screen"><svg class="i"><use href="#i-expand"/></svg></button>
        <button id="lyr" class="ib" title="Lyrics"><svg class="i"><use href="#i-mic"/></svg></button>
        <button id="sleep" class="ib" title="Sleep timer"><svg class="i"><use href="#i-moon"/></svg><span id="sleep-txt"></span></button>
        <svg class="i vol-i"><use href="#i-volume"/></svg>
        <input id="vol" type="range" min="0" max="100" value="80" title="Volume" />
      </div>
    </footer>
  </div>

  <section id="full" hidden>
    <div id="fbg"></div><div id="fshade"></div>
    <button id="fclose" class="ib" title="Close (Esc)"><svg class="i"><use href="#i-expand"/></svg></button>
    <div id="fbody">
      <div id="fleft">
        <img id="fart" alt="" />
        <div id="ft"></div><div id="fa"></div>
        <div id="fseek"><span id="fcur">0:00</span><input id="fbar" type="range" min="0" max="1000" value="0" /><span id="fdur">0:00</span></div>
        <div id="fctl">
          <button id="fprev" class="ib" title="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
          <button id="fplay" title="Play / pause"><svg class="i"><use href="#i-play"/></svg></button>
          <button id="fnextb" class="ib" title="Next"><svg class="i"><use href="#i-next"/></svg></button>
          <button id="frep" class="ib" title="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
      </div>
      <div id="flyr"></div>
    </div>
  </section>
  <aside id="lyrics" hidden><div id="lyr-head"><b>Lyrics</b> <span id="lyr-src"></span><button id="lyr-close">✕</button></div><div id="lyr-body"></div></aside>
  <div id="ctx" hidden></div>
  <div id="toast" hidden></div>
  <div id="modal" hidden><div class="mbox"><h3 id="m-title"></h3><input id="m-input" /><div class="mbtns"><button id="m-cancel">Cancel</button><button id="m-ok">Create</button></div></div></div>
  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
