<!doctype html>
<html><head><meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<style>
  html,body{margin:0;height:100%;background:#0c0c0f;color:#fff;font:13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
  #w{height:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;-webkit-app-region:drag;position:relative}
  #bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) brightness(.4) saturate(1.5)}
  #art{position:relative;width:96px;height:96px;border-radius:8px;object-fit:cover;background:#17171c;flex:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #info{position:relative;min-width:0;flex:1}
  #t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #a{color:#c7c7d1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  #bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;margin:10px 0 6px;overflow:hidden}
  #fill{height:100%;width:0;background:#fff}
  #c{display:flex;align-items:center;gap:6px;-webkit-app-region:no-drag}
  button{border:0;background:none;color:#fff;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;padding:0}
  button:hover{background:rgba(255,255,255,.15)}
  #p{background:#fff;color:#000;width:38px;height:38px}
  #p:hover{background:#fff;transform:scale(1.06)}
  svg{width:22px;height:22px;fill:currentColor}
  #x{position:absolute;top:4px;right:4px;width:26px;height:26px;-webkit-app-region:no-drag;color:#c7c7d1}
  #x svg{width:16px;height:16px}
</style></head>
<body><div id="w"><div id="bg"></div><img id="art" alt="" />
  <div id="info"><div id="t">Nothing playing</div><div id="a"></div><div id="bar"><div id="fill"></div></div>
    <div id="c"><button data-a="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="p" data-a="playpause" title="Play / pause"><svg id="pi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button data-a="next" title="Next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div></div>
  <button id="x" data-a="restore" title="Back to the full app"><svg viewBox="0 0 24 24"><path d="M5 5h6v2H7v4H5V5zm14 14h-6v-2h4v-4h2v6zM5 19v-6h2v4h4v2H5zM19 5v6h-2V7h-4V5h6z"/></svg></button>
</div><script src="mini.js"></script></body></html>
